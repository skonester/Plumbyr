[package]
name = "plumbyr-recovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[lib]
name = "reclaim"
path = "src/lib.rs"

[[bin]]
name = "plumbyr-recovery"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
serde_json = "=1.0.151"
image = { version = "=0.25.10", default-features = false, features = ["ico", "png", "bmp", "jpeg", "gif", "webp"] }
crc32fast = "=1.5.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = "=0.41.0"
tempfile = "=3.27.0"
base64 = "=0.22.1"
log = "=0.4.34"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
